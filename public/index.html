<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>InvoicePilot</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 560px; margin: 48px auto; padding: 0 16px; }
  label { display: block; margin: 12px 0 4px; font-weight: 600; }
  input { width: 100%; padding: 8px; box-sizing: border-box; }
  button { margin-top: 16px; padding: 10px 18px; cursor: pointer; }
  pre { background: #f4f4f4; padding: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>InvoicePilot</h1>
<p>Describe the job, send the invoice through PayPal sandbox.</p>

<h2>Send an invoice</h2>
<label for="clientEmail">Client email</label>
<input id="clientEmail" type="email" placeholder="client@example.com">
<label for="description">Job description</label>
<input id="description" type="text" placeholder="Logo design for Acme">
<label for="amount">Amount</label>
<input id="amount" type="number" step="0.01" placeholder="400">
<label for="currency">Currency</label>
<input id="currency" type="text" value="USD">
<button id="sendBtn">Create and send invoice</button>
<pre id="sendResult"></pre>

<h2>Check status</h2>
<label for="invoiceId">Invoice ID</label>
<input id="invoiceId" type="text" placeholder="INV2-...">
<button id="statusBtn">Check status</button>
<pre id="statusResult"></pre>

<script>
async function postJson(url, body) {
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return res.json();
}
document.getElementById('sendBtn').addEventListener('click', async () => {
  const out = document.getElementById('sendResult');
  out.textContent = 'Sending...';
  const result = await postJson('/api/invoices', {
    clientEmail: document.getElementById('clientEmail').value.trim(),
    description: document.getElementById('description').value.trim(),
    amount: document.getElementById('amount').value.trim(),
    currency: document.getElementById('currency').value.trim(),
  });
  out.textContent = JSON.stringify(result, null, 2);
  if (result.id) document.getElementById('invoiceId').value = result.id;
});
document.getElementById('statusBtn').addEventListener('click', async () => {
  const out = document.getElementById('statusResult');
  const id = document.getElementById('invoiceId').value.trim();
  if (!id) { out.textContent = 'Enter an invoice ID first.'; return; }
  out.textContent = 'Checking...';
  const res = await fetch('/api/invoices/' + encodeURIComponent(id));
  out.textContent = JSON.stringify(await res.json(), null, 2);
});
</script>
</body>
</html>
